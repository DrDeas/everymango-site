                {count > 0 && <span className="text-xs font-bold px-2 py-0.5 rounded-lg" style={{ background: 'rgba(255,255,255,0.22)' }}>{count}</span>}
            </button>
        );
        }

        function Sidebar({ onClose }) {
            const s = useStore();
            const { boards, view, activeBoardId, navigate } = s;
            const brainCount = (boards.find(b => b.id === BRAIN_DUMP_BOARD_ID)?.groups || []).reduce((n, g) => n + g.tasks.filter(isOpen).length, 0);
            const somedayCount = (boards.find(b => b.id === SOMEDAY_MAYBE_BOARD_ID)?.groups || []).reduce((n, g) => n + g.tasks.filter(isOpen).length, 0);
            const todayCount = s.allTasks.filter(t => isActionable(t) && t.dueDate === todayStr()).length;
            const userBoards = boards.filter(b => !isSystemBoardId(b.id));
            const sortedBoards = [...userBoards.filter(b => b.isPinned), ...userBoards.filter(b => !b.isPinned)];
            const displayName = s.demo ? 'Demo mode' : (s.userProfile?.displayName || s.user?.displayName || s.user?.email?.split('@')[0] || 'You');

            const syncLabel = s.demo ? { icon: 'fa-flask', text: 'Demo — saved in this browser' }
                : !s.online ? { icon: 'fa-wifi', text: 'Offline — will sync later' }
                : s.syncState === 'saving' ? { icon: 'fa-circle-notch fa-spin', text: 'Saving…' }
                : s.syncState === 'error' ? { icon: 'fa-exclamation-triangle', text: 'Couldn’t save — retrying' }
                : { icon: 'fa-cloud', text: 'All changes saved' };

            return (
                <>
                    <div className="fixed inset-0 z-30 overlay lg:hidden fade-in" onClick={onClose}></div>
                    <aside className="on-leaf fixed inset-y-0 left-0 z-40 lg:static w-72 lg:w-64 max-w-[85vw] flex flex-col sidebar-gentle sidebar-in lg:animate-none flex-shrink-0" aria-label="Main navigation">
                        <div className="px-4 pt-4 pb-3 flex items-center justify-between">
                            <div className="flex items-center">
                                <MangoLogo size={28} className="mr-2" />
                                <div>
                                    <h1 className="text-lg font-bold text-white leading-tight">EveryMango</h1>
                                    <p className="tagline text-white">Ripen at your own pace</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="icon-btn icon-btn-leaf" aria-label="Close menu"><i className="fas fa-angles-left"></i></button>
                        </div>

                        <nav className="px-3 space-y-1">
                            <NavItem active={view === 'today'} icon="fa-sun" label="Today" count={todayCount} onClick={() => navigate('today')} />
                            <NavItem active={view === 'timeblocking'} icon="fa-clock" label="Time Blocking" onClick={() => navigate('timeblocking')} />
                            <NavItem active={view === 'timeline'} icon="fa-calendar-alt" label="Timeline" onClick={() => navigate('timeline')} />
                            <NavItem active={view === 'dashboard'} icon="fa-chart-line" label="Dashboard" onClick={() => navigate('dashboard')} />
                            <NavItem active={view === 'team'} icon="fa-users" label="Team" onClick={() => navigate('team')} />
                        </nav>

                        <div className="flex-1 overflow-y-auto scrollbar-sage px-3 pt-4 pb-3">
                            <h2 className="text-xs font-bold uppercase tracking-wider mb-2 px-3" style={{ color: 'rgba(255,255,255,0.7)' }}>Capture</h2>
                            <div className="space-y-1 mb-4">
                                <NavItem active={view === 'board' && activeBoardId === BRAIN_DUMP_BOARD_ID} icon="fa-brain" iconColor="var(--golden-flesh)" label="Brain Dump" count={brainCount} onClick={() => navigate('board', BRAIN_DUMP_BOARD_ID)} />
                                <NavItem active={view === 'board' && activeBoardId === SOMEDAY_MAYBE_BOARD_ID} icon="fa-cloud" iconColor="#cfe3ee" label="Someday / Maybe" count={somedayCount} onClick={() => navigate('board', SOMEDAY_MAYBE_BOARD_ID)} />
                            </div>

                            <div className="flex items-center justify-between mb-2 px-3">
                                <h2 className="text-xs font-bold uppercase tracking-wider" style={{ color: 'rgba(255,255,255,0.7)' }}>Boards</h2>
                                <button onClick={s.addBoard} className="icon-btn icon-btn-leaf" style={{ width: '1.75rem', height: '1.75rem' }} aria-label="Add board" title="Add board"><i className="fas fa-plus text-xs"></i></button>
                            </div>
                            <div className="space-y-1">
                                {sortedBoards.map(board => (
                                    <NavItem key={board.id} active={view === 'board' && activeBoardId === board.id} dot={board.color}
                                        label={<>{board.name}{board.isPinned && <i className="fas fa-thumbtack ml-2 text-xs opacity-60" aria-label="Pinned"></i>}</>}
                                        count={board.groups.reduce((n, g) => n + g.tasks.filter(isOpen).length, 0)}
                                        onClick={() => navigate('board', board.id)} />
                                ))}
                                {sortedBoards.length === 0 && (
                                    <button onClick={s.addBoard} className="w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold text-white" style={{ border: '2px dashed rgba(255,255,255,.35)' }}>
                                        <i className="fas fa-plus mr-2"></i>Create your first board
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="px-3 py-3" style={{ borderTop: '1px solid rgba(255,255,255,0.14)' }}>
                            <div className="flex items-center gap-2">
                                <button onClick={s.openSettings} className="flex items-center gap-2 flex-1 min-w-0 text-left rounded-xl p-1.5 text-white" title="Settings">
                                    <Avatar avatar={s.userProfile?.photoURL} name={displayName} size={32} />
                                    <span className="min-w-0">
                                        <span className="block text-sm font-bold truncate">{displayName}</span>
                                        <span className="block text-xs truncate" style={{ color: 'rgba(255,255,255,0.75)' }}><i className={`fas ${syncLabel.icon} mr-1`}></i>{syncLabel.text}</span>
                                    </span>
                                </button>
                                <button onClick={s.openSettings} className="icon-btn icon-btn-leaf" aria-label="Settings"><i className="fas fa-cog"></i></button>
                            </div>
                        </div>
                    </aside>
                </>
            );
        }

        // ------------------------------------------------------------------
        // Toasts, notifications, timer, search
        // ------------------------------------------------------------------
        function Toast({ toast, onDismiss }) {
            const mango = toast.tone === 'mango';
            return (
                <div className="pop-in pointer-events-auto rounded-2xl shadow-soft-lg px-4 py-3 w-full sm:w-auto sm:max-w-sm flex items-center gap-3"
                    style={{ background: mango ? 'var(--golden-flesh)' : 'var(--soft-black)', color: mango ? 'var(--soft-black)' : '#fff' }} role="status">
                    <i className={`fas ${toast.icon || 'fa-check'} flex-shrink-0`} style={{ color: mango ? 'var(--soft-black)' : 'var(--golden-flesh)' }}></i>
                    <div className="flex-1 min-w-0">
                        <p className="text-sm font-bold">{toast.message}</p>
                        {toast.detail && <p className="text-xs mt-0.5 opacity-80"><i className="fas fa-heart mr-1"></i>{toast.detail}</p>}
                    </div>
                    {toast.action && (
                        <button className="text-sm font-extrabold underline flex-shrink-0" style={{ color: mango ? 'var(--soft-black)' : 'var(--golden-flesh)' }}
                            onClick={() => { toast.action.onClick(); onDismiss(); }}>{toast.action.label}</button>
                    )}
                    <button onClick={onDismiss} className="opacity-60 hover:opacity-100 flex-shrink-0" aria-label="Dismiss"><i className="fas fa-times"></i></button>
                </div>
            );
        }

        function NotificationPanel({ notifications, onClose, onOpen, onMarkAllRead, onClear }) {
            const { notificationsEnabled, setNotificationsEnabled } = useStore();
            const timeAgo = (timestamp) => {
                const minutes = Math.floor((Date.now() - timestamp) / 60000);
                if (minutes < 1) return 'Just now';
                if (minutes < 60) return `${minutes}m ago`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h ago`;
                return `${Math.floor(hours / 24)}d ago`;
            };
            const iconFor = (type) => ({
                'due-today': { icon: 'fa-sun', color: 'var(--golden-flesh)' },
                'due-tomorrow': { icon: 'fa-clock', color: 'var(--sky)' },
                'custom-reminder': { icon: 'fa-bell', color: 'var(--ripe-mango)' },
                'timer': { icon: 'fa-hourglass-half', color: 'var(--sanctuary-sage)' }
            }[type] || { icon: 'fa-info-circle', color: 'var(--linen)' });

            return (
                <div className="fixed inset-0 z-50" onClick={onClose}>
                    <div className="absolute right-2 sm:right-6 top-16 w-[calc(100vw-1rem)] sm:w-96 max-h-[75vh] overflow-hidden bg-white rounded-2xl shadow-soft-lg border pop-in flex flex-col" style={{ borderColor: 'var(--linen)' }} onClick={(e) => e.stopPropagation()} role="dialog" aria-label="Notifications">
                        <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: 'var(--linen)', background: 'var(--cream-dark)' }}>
                            <h3 className="font-bold"><i className="fas fa-bell mr-2" style={{ color: 'var(--ripe-mango)' }}></i>Reminders</h3>
                            <div className="flex items-center gap-2 text-xs font-bold" style={{ color: 'var(--muted)' }}>
                                <span>{notificationsEnabled ? 'On' : 'Paused'}</span>
                                <Toggle on={notificationsEnabled} onChange={setNotificationsEnabled} label="Show reminder pop-ups" />
                                <button onClick={onClose} className="icon-btn" aria-label="Close"><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                        {notifications.length > 0 && (
                            <div className="px-4 py-2 border-b flex items-center justify-between text-sm font-bold" style={{ borderColor: 'var(--linen)' }}>
                                <button onClick={onMarkAllRead} style={{ color: '#3F5F3F' }}>Mark all as read</button>
                                <button onClick={onClear} style={{ color: 'var(--muted)' }}>Clear all</button>
                            </div>
                        )}
                        <div className="overflow-y-auto scrollbar-thin">
                            {notifications.length === 0 ? (
                                <EmptyState icon="fa-bell-slash" title="All quiet">You’ll get gentle nudges here for things you’ve planned.</EmptyState>
                            ) : notifications.map(n => {
                                const info = iconFor(n.type);
                                return (
                                    <button key={n.id} onClick={() => onOpen(n)} className="w-full text-left px-4 py-3 border-b flex items-start gap-3 hover:bg-[#FFFCF6]"
                                        style={{ borderColor: 'var(--linen)', background: n.read ? undefined : 'rgba(244, 162, 89, 0.10)' }}>
                                        <span className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: info.color }}>
                                            <i className={`fas ${info.icon}`} style={{ color: 'var(--soft-black)' }}></i>
                                        </span>
                                        <span className="flex-1 min-w-0">
                                            <span className="block font-semibold text-sm">{n.message}</span>
                                            {n.whyItMatters && <span className="block text-sm mt-1 italic" style={{ color: '#9A5A1E' }}><i className="fas fa-heart mr-1"></i>{n.whyItMatters}</span>}
                                            <span className="block text-xs mt-1" style={{ color: 'var(--muted)' }}>{n.boardName ? `${n.boardName} • ` : ''}{timeAgo(n.timestamp)}</span>
                                        </span>
                                        {!n.read && <span className="w-2.5 h-2.5 rounded-full flex-shrink-0 mt-1.5" style={{ background: 'var(--ripe-mango)' }}></span>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function PomodoroWidget() {
            const { pomo, prefs, allTasks, togglePomodoro, stopPomodoro, toggleDone, openTask } = useStore();
            // The countdown ticks here so the rest of the app stays still while you focus.
            const [, setTick] = useState(0);
            useEffect(() => {
                if (!pomo.running) return;
                const interval = setInterval(() => setTick(t => t + 1), 500);
                return () => clearInterval(interval);
            }, [pomo.running]);
            const pomoRemaining = pomo.running ? Math.max(0, Math.ceil((pomo.endsAt - Date.now()) / 1000)) : pomo.remaining;
            useEffect(() => {
                document.title = `${pad2(Math.floor(pomoRemaining / 60))}:${pad2(pomoRemaining % 60)} · ${pomo.phase === 'break' ? 'Break' : 'Focus'} — EveryMango`;
            });
            useEffect(() => () => { document.title = 'EveryMango - Gentle Project Management'; }, []);
            const task = allTasks.find(t => t.id === pomo.taskId);
            const total = (pomo.phase === 'break' ? prefs.breakMin : prefs.focusMin) * 60;
            const progress = total ? ((total - pomoRemaining) / total) * 100 : 0;
            const isBreak = pomo.phase === 'break';
            return (
                <div className={`fixed z-40 bottom-4 left-4 right-4 sm:right-auto sm:w-80 rounded-2xl shadow-soft-lg p-3 flex items-center gap-3 pop-in ${pomo.running ? 'timer-pulse' : ''}`}
                    style={{ background: 'var(--soft-black)', color: '#fff' }} role="timer" aria-label={isBreak ? 'Break timer' : 'Focus timer'}>
                    <ProgressRing value={progress} size={52} stroke={5} color={isBreak ? 'var(--sanctuary-sage)' : 'var(--ripe-mango)'}>
                        <span className="text-base">{isBreak ? '☕' : '🥭'}</span>
                    </ProgressRing>
                    <button className="flex-1 min-w-0 text-left" onClick={() => task && openTask(task.id)} title="Open task">
                        <span className="block text-xl font-bold leading-tight" style={{ fontVariantNumeric: 'tabular-nums' }}>
                            {pad2(Math.floor(pomoRemaining / 60))}:{pad2(pomoRemaining % 60)}
                            <span className="text-xs font-bold ml-2 uppercase tracking-wider" style={{ color: 'var(--golden-flesh)' }}>{isBreak ? 'Break' : pomo.running ? 'Focus' : 'Paused'}</span>
                        </span>
                        <span className="block text-xs truncate opacity-80">{isBreak ? 'Stretch, sip, breathe.' : (task ? task.name : 'Focus session')}</span>
                    </button>
                    <button className="icon-btn icon-btn-leaf" onClick={togglePomodoro} aria-label={pomo.running ? 'Pause timer' : 'Resume timer'}><i className={`fas ${pomo.running ? 'fa-pause' : 'fa-play'}`}></i></button>
                    {task && !isBreak && <button className="icon-btn icon-btn-leaf" onClick={() => toggleDone(task.id)} aria-label="Mark task done" title="Mark done"><i className="fas fa-check"></i></button>}
                    <button className="icon-btn icon-btn-leaf" onClick={stopPomodoro} aria-label="Stop timer" title="Stop"><i className="fas fa-stop"></i></button>
                </div>
            );
        }

        function SearchPalette({ onClose }) {
            const { allTasks, boards, openTask, navigate } = useStore();
            const [query, setQuery] = useState('');
            const [index, setIndex] = useState(0);
            const results = useMemo(() => {
                const q = query.trim().toLowerCase();
                if (!q) return [];
                const boardHits = boards.filter(b => b.name.toLowerCase().includes(q)).map(b => ({ kind: 'board', id: b.id, title: b.name, sub: 'Board', color: b.color }));
                const taskHits = allTasks
                    .filter(t => t.name.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q))
                    .sort((a, b) => (a.status === 'done') - (b.status === 'done'))
                    .slice(0, 25)
                    .map(t => ({ kind: 'task', id: t.id, title: t.name, sub: `${t.boardName} • ${t.groupName}`, done: t.status === 'done' }));
                return [...boardHits, ...taskHits];
            }, [query, allTasks, boards]);
            useEffect(() => setIndex(0), [query]);
            const choose = (r) => {
                if (!r) return;
                if (r.kind === 'board') navigate('board', r.id);
                else openTask(r.id);
                onClose();
            };
            return (
                <div className="fixed inset-0 z-50 overlay fade-in flex items-start justify-center p-3 pt-[10vh]" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-soft-lg overflow-hidden pop-in" role="dialog" aria-label="Search">
                        <div className="relative border-b" style={{ borderColor: 'var(--linen)' }}>
                            <i className="fas fa-search absolute left-5 top-1/2 -translate-y-1/2" style={{ color: 'var(--warm-gray)' }}></i>
                            <input autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search tasks and boards…" aria-label="Search tasks and boards"
                                className="w-full pl-12 pr-4 py-4 text-base font-medium" style={{ border: 'none', boxShadow: 'none' }}
                                onKeyDown={(e) => {
                                    if (e.key === 'ArrowDown') { e.preventDefault(); setIndex(i => Math.min(i + 1, results.length - 1)); }
                                    if (e.key === 'ArrowUp') { e.preventDefault(); setIndex(i => Math.max(i - 1, 0)); }
                                    if (e.key === 'Enter') choose(results[index]);
                                }} />
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto scrollbar-thin">
                            {!query.trim() && <p className="p-5 text-sm" style={{ color: 'var(--muted)' }}>Type to find any task or board. <kbd>↑</kbd> <kbd>↓</kbd> to move, <kbd>Enter</kbd> to open.</p>}
                            {query.trim() && results.length === 0 && <p className="p-5 text-sm" style={{ color: 'var(--muted)' }}>Nothing matches “{query}” yet.</p>}
                            {results.map((r, i) => (
                                <button key={r.kind + r.id} onClick={() => choose(r)} onMouseEnter={() => setIndex(i)}
                                    className="w-full text-left px-5 py-3 flex items-center gap-3" style={{ background: i === index ? 'rgba(107, 142, 107, 0.10)' : undefined }}>
                                    {r.kind === 'board'
                                        ? <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: r.color }}></span>
                                        : <i className={`fas ${r.done ? 'fa-check-circle' : 'fa-circle'} text-xs flex-shrink-0`} style={{ color: r.done ? 'var(--sage)' : 'var(--linen)' }}></i>}
                                    <span className="flex-1 min-w-0">
                                        <span className={`block font-semibold text-sm truncate ${r.done ? 'line-through opacity-60' : ''}`}>{r.title}</span>
                                        <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{r.sub}</span>
                                    </span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Task row — one calm line per task. Details live in the side panel.
        // ------------------------------------------------------------------
        function DueChip({ task }) {
            const { gentle } = useStore();
            const days = getDaysUntil(task.dueDate);
            if (days === null) return null;
            const done = task.status === 'done';
            if (days < 0 && !done) {
                const n = Math.abs(days);
                return gentle
                    ? <span className="chip chip-gold" title="No judgment — mangoes ripen at their own pace">{n === 1 ? 'Yesterday' : `${n}d ago`}</span>
                    : <span className="chip chip-red"><i className="fas fa-exclamation-circle"></i>{n}d overdue</span>;
            }
            if (days === 0) return <span className="chip chip-mango"><i className="fas fa-sun"></i>Today{task.timeBlock ? ` · ${formatTime(task.timeBlock)}` : ''}</span>;
            if (days === 1) return <span className="chip chip-sky">Tomorrow</span>;
            return <span className="chip">{formatDate(task.dueDate)}</span>;
        }

        function TaskRow({ task, showBoard = false, triage = false }) {
            const s = useStore();
            const done = task.status === 'done';
            const subtasks = task.subtasks || [];
            const subDone = subtasks.filter(x => x.done).length;
            const energy = ENERGY_OPTS.find(e => e.value === task.energyLevel);
            const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
            const timing = s.pomo && s.pomo.taskId === task.id;

            return (
                <div className={`task-row type-${task.taskType} ${s.selectedTaskId === task.id ? 'is-selected' : ''}`}
                    onClick={() => s.openTask(task.id)} role="button" tabIndex={0} aria-label={`Open task: ${task.name}`}
                    onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); s.openTask(task.id); } }}>
                    <button className={`check ${done ? 'checked' : ''}`} onClick={stop(() => s.toggleDone(task.id))}
                        aria-label={done ? `Mark “${task.name}” as not done` : `Mark “${task.name}” as done`} aria-pressed={done}>
                        <i className="fas fa-check"></i>
                    </button>
                    <div className="flex-1 min-w-0">
                        <div className={`font-semibold text-[15px] leading-snug break-words ${done ? 'line-through opacity-50' : ''}`}>{task.name || 'Untitled task'}</div>
                        <div className="flex flex-wrap items-center gap-1.5 mt-1">
                            {showBoard && <span className="chip" style={{ background: 'transparent', paddingLeft: 0, color: 'var(--muted)' }}><span className="w-2 h-2 rounded-full" style={{ background: task.boardColor }}></span>{task.boardName}</span>}
                            {!done && task.status === 'working' && <span className="chip status-working"><i className="fas fa-spinner"></i>Working</span>}
                            {!done && task.status === 'stuck' && <span className="chip status-stuck"><i className="fas fa-hand-paper"></i>Stuck</span>}
                            {!done && <DueChip task={task} />}
                            {!done && isQuickWin(task) && <span className="chip chip-quick"><i className="fas fa-bolt"></i>Quick win</span>}
                            {!done && <span className="chip" title={`About ${formatMinutes(getTimeInMinutes(task.timeEstimate))}, ${energy ? energy.label.toLowerCase() : 'medium'} energy`}>
                                <i className="far fa-clock"></i>{TIME_OPTS.find(t => t.value === task.timeEstimate)?.label || '30m'}
                                {energy && <><span className="opacity-40">·</span><i className={`fas ${energy.icon}`}></i>{energy.label}</>}
                            </span>}
                            {subtasks.length > 0 && <span className="chip chip-leaf"><i className="fas fa-list-check"></i>{subDone}/{subtasks.length}</span>}
                            {!done && task.repeat && <span className="chip" title={REPEAT_OPTS.find(r => r.value === task.repeat)?.label}><i className="fas fa-redo"></i></span>}
                            {!done && task.rolloverCount > 0 && <span className="chip chip-gold" title={`Carried forward ${task.rolloverCount} time${task.rolloverCount > 1 ? 's' : ''} — that’s okay`}><i className="fas fa-seedling"></i>{task.rolloverCount}</span>}
                            {!done && task.whyItMatters && <span className="chip chip-mango" title={task.whyItMatters}><i className="fas fa-heart"></i></span>}
                            {task.notes && <span className="chip" title="Has notes"><i className="far fa-sticky-note"></i></span>}
                            {task.assignee && <span className="chip"><i className="far fa-user"></i>{task.assignee}</span>}
                        </div>
                        {triage && !done && (
                            <div className="flex flex-wrap gap-2 mt-2">
                                {!isToday(task.dueDate) && <button className="btn btn-sm btn-mango" onClick={stop(() => s.updateTask(task.id, { dueDate: todayStr() }))}><i className="fas fa-sun"></i>Do today</button>}
                                <button className="btn btn-sm btn-soft" onClick={stop(() => s.openTask(task.id))}><i className="fas fa-folder-open"></i>Move to a board</button>
                                <button className="btn btn-sm btn-soft" onClick={stop(() => s.sendToSomeday(task.id))}><i className="fas fa-cloud"></i>Someday</button>
                            </div>
                        )}
                    </div>
                    <div className="flex items-center gap-0.5 flex-shrink-0 -mr-1">
                        {!done && (
                            <button className={`icon-btn ${timing ? '' : 'row-actions'}`} onClick={stop(() => timing ? s.stopPomodoro() : s.startPomodoro(task.id))}
                                aria-label={timing ? 'Stop focus timer' : 'Start focus timer'} title={timing ? 'Stop focus timer' : `Start a ${s.prefs.focusMin}-minute focus timer`}
                                style={timing ? { color: '#fff', background: 'var(--ripe-mango)' } : undefined}>
                                <i className={`fas ${timing ? 'fa-stop' : 'fa-play'} text-xs`}></i>
                            </button>
                        )}
                        <button className="icon-btn" onClick={stop(() => s.updateTask(task.id, { isFocusTask: !task.isFocusTask }))}
                            aria-label={task.isFocusTask ? 'Remove star' : 'Star as a focus task'} aria-pressed={task.isFocusTask} title={task.isFocusTask ? 'Starred for Focus' : 'Star for Focus'}>
                            <i className={`${task.isFocusTask ? 'fas' : 'far'} fa-star`} style={{ color: task.isFocusTask ? 'var(--ripe-mango)' : 'var(--warm-gray)' }}></i>
                        </button>
                    </div>
                </div>
            );
        }

        // Type a task, press Enter, keep going.
        function QuickAdd({ onAdd, placeholder = 'Add a task…' }) {
            const [text, setText] = useState('');
            const submit = () => {
                if (!text.trim()) return;
                onAdd(text.trim());
                setText('');
            };
            return (
                <div className="flex items-center gap-2 px-3 py-2" style={{ background: '#fff' }}>
                    <i className="fas fa-plus w-6 text-center text-sm" style={{ color: 'var(--sage)' }} aria-hidden="true"></i>
                    <input value={text} onChange={(e) => setText(e.target.value)} placeholder={placeholder} aria-label={placeholder}
                        onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
                        className="flex-1 min-w-0 py-1.5 px-2 text-[15px] font-medium rounded-lg bg-transparent" style={{ border: '2px solid transparent' }} />
                    {text.trim() && <button className="btn btn-sm btn-primary" onClick={submit}>Add</button>}
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Task detail panel
        // ------------------------------------------------------------------
        function Section({ label, hint, children }) {
            return (
                <div>
                    <div className="flex items-baseline justify-between">
                        <span className="label">{label}</span>
                        {hint && <span className="text-xs" style={{ color: 'var(--muted)' }}>{hint}</span>}
                    </div>
                    {children}
                </div>
            );
        }

        function TaskDetail({ task }) {
            const s = useStore();
            const update = (updates) => s.updateTask(task.id, updates);
            const [newStep, setNewStep] = useState('');
            const [showMore, setShowMore] = useState(false);
            const today = todayStr();
            const subtasks = task.subtasks || [];
            const done = task.status === 'done';
            const inSomeday = task.boardId === SOMEDAY_MAYBE_BOARD_ID;
            const timing = s.pomo && s.pomo.taskId === task.id;
            const days = getDaysUntil(task.dueDate);

            const addStep = () => {
                if (!newStep.trim()) return;
                update({ subtasks: [...subtasks, { id: generateId(), name: newStep.trim(), done: false }] });
                setNewStep('');
            };
            const dateChips = [
                { label: 'Today', value: today },
                { label: 'Tomorrow', value: addDays(today, 1) },
                { label: 'Next week', value: addDays(today, 7) },
                { label: 'No date', value: '' }
            ];

            return (
                <>
                    <div className="fixed inset-0 z-40 overlay fade-in xl:hidden" onClick={s.closeTask}></div>
                    <aside className="fixed inset-y-0 right-0 z-50 xl:static xl:z-auto w-full sm:w-[440px] xl:w-[420px] flex-shrink-0 bg-white flex flex-col drawer-in border-l shadow-soft-lg xl:shadow-none" style={{ borderColor: 'var(--linen)' }} aria-label="Task details">
                        <div className="px-4 py-3 flex items-center justify-between border-b" style={{ borderColor: 'var(--linen)', background: 'var(--cream)' }}>
                            <span className="text-xs font-bold truncate" style={{ color: 'var(--muted)' }}>
                                <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ background: task.boardColor }}></span>
                                {task.boardName} • {task.groupName}
                            </span>
                            <div className="flex items-center">
                                <button className="icon-btn" onClick={() => update({ isFocusTask: !task.isFocusTask })} aria-pressed={task.isFocusTask} aria-label="Star as a focus task" title="Star for Focus">
                                    <i className={`${task.isFocusTask ? 'fas' : 'far'} fa-star`} style={{ color: task.isFocusTask ? 'var(--ripe-mango)' : undefined }}></i>
                                </button>
                                <button className="icon-btn" onClick={s.closeTask} aria-label="Close details"><i className="fas fa-times"></i></button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto scrollbar-thin p-5 space-y-6">
                            <div className="flex items-start gap-3">
                                <button className={`check ${done ? 'checked' : ''}`} style={{ width: '1.7rem', height: '1.7rem', marginTop: '.3rem' }} onClick={() => s.toggleDone(task.id)} aria-label={done ? 'Mark as not done' : 'Mark as done'} aria-pressed={done}>
                                    <i className="fas fa-check"></i>
                                </button>
                                <textarea value={task.name} rows={Math.min(4, Math.max(1, Math.ceil((task.name || '').length / 28)))} aria-label="Task name" placeholder="What needs doing?"
                                    onChange={(e) => update({ name: e.target.value.replace(/\n/g, ' ') })}
                                    onBlur={() => { if (!task.name.trim()) update({ name: 'Untitled task' }); }}
                                    className={`flex-1 text-xl font-bold leading-snug resize-none rounded-lg px-2 py-1 -ml-2 ${done ? 'line-through opacity-60' : ''}`}
                                    style={{ border: '2px solid transparent', fontFamily: 'Quicksand, sans-serif' }} />
                            </div>

                            {!done && (
                                <button className={`btn w-full ${timing ? 'btn-soft' : 'btn-primary'}`} onClick={() => timing ? s.stopPomodoro() : s.startPomodoro(task.id)}>
                                    <i className={`fas ${timing ? 'fa-stop' : 'fa-play'}`}></i>{timing ? 'Stop focus timer' : `Start a ${s.prefs.focusMin}-minute focus session`}
                                </button>
                            )}

                            <Section label="Status">
                                <div className="flex flex-wrap gap-2">
                                    {STATUS_OPTS.map(o => (
                                        <button key={o.value} className={`opt ${task.status === o.value ? (o.value === 'stuck' ? 'active-mango' : 'active') : ''}`} aria-pressed={task.status === o.value} onClick={() => s.setStatus(task.id, o.value)}>{o.label}</button>
                                    ))}
                                </div>
                                {task.status === 'stuck' && (
                                    <div className="mt-3 p-3 rounded-2xl" style={{ background: 'rgba(244, 162, 89, 0.12)' }}>
                                        <label className="text-sm font-bold block mb-2" htmlFor="stuck-notes">What’s in the way? <span className="font-medium" style={{ color: 'var(--muted)' }}>Naming it is half the work.</span></label>
                                        <textarea id="stuck-notes" value={task.contextNotes || ''} onChange={(e) => update({ contextNotes: e.target.value })} rows="2" className="field" placeholder="Waiting on someone? Unclear first step? Just not feeling it?" />
                                    </div>
                                )}
                            </Section>

                            {!inSomeday && (
                                <Section label="When" hint={days !== null && days < 0 && !done ? (s.gentle ? `${Math.abs(days)}d ago — no judgment 🥭` : `${Math.abs(days)}d overdue`) : (task.dueDate ? formatDate(task.dueDate) : '')}>
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {dateChips.map(c => (
                                            <button key={c.label} className={`opt ${task.dueDate === c.value ? 'active' : ''}`} aria-pressed={task.dueDate === c.value}
                                                onClick={() => update({ dueDate: c.value, ...(c.value !== today ? { timeBlock: null } : {}), ...(c.value ? {} : { reminderTime: null, repeat: '' }) })}>{c.label}</button>
                                        ))}
                                    </div>
                                    <input type="date" value={task.dueDate || ''} aria-label="Due date" className="field"
                                        onChange={(e) => update({ dueDate: e.target.value, ...(e.target.value !== today ? { timeBlock: null } : {}) })} />
                                    {task.dueDate && (
                                        <div className="grid grid-cols-2 gap-2 mt-2">
                                            <div>
                                                <label className="text-xs font-bold block mb-1" style={{ color: 'var(--muted)' }} htmlFor="detail-reminder"><i className="fas fa-bell mr-1"></i>Remind me at</label>
                                                <input id="detail-reminder" type="time" value={task.reminderTime || ''} onChange={(e) => update({ reminderTime: e.target.value || null })} className="field" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold block mb-1" style={{ color: 'var(--muted)' }} htmlFor="detail-repeat"><i className="fas fa-redo mr-1"></i>Repeat</label>
                                                <select id="detail-repeat" value={task.repeat || ''} onChange={(e) => update({ repeat: e.target.value })} className="field">
                                                    {REPEAT_OPTS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}
                                </Section>
                            )}

                            <Section label="How long?" hint={isQuickWin(task) ? '⚡ Quick win' : ''}>
                                <div className="flex flex-wrap gap-2">
                                    {TIME_OPTS.map(o => (
                                        <button key={o.value} className={`opt ${task.timeEstimate === o.value ? (o.minutes <= 15 ? 'active-yellow' : 'active') : ''}`} aria-pressed={task.timeEstimate === o.value} onClick={() => update({ timeEstimate: o.value })}>{o.label}</button>
                                    ))}
                                </div>
                            </Section>

                            <Section label="Energy it takes">
                                <div className="flex flex-wrap gap-2">
                                    {ENERGY_OPTS.map(o => (
                                        <button key={o.value} className={`opt ${task.energyLevel === o.value ? 'active' : ''}`} aria-pressed={task.energyLevel === o.value} onClick={() => update({ energyLevel: o.value })}>
                                            <i className={`fas ${o.icon} mr-1.5`}></i>{o.label}
                                        </button>
                                    ))}
                                </div>

                                                onClick={() => update({ subtasks: subtasks.map(x => x.id === step.id ? { ...x, done: !x.done } : x) })}><i className="fas fa-check"></i></button>
                                            <input value={step.name} aria-label="Step name" onChange={(e) => update({ subtasks: subtasks.map(x => x.id === step.id ? { ...x, name: e.target.value } : x) })}

                                            <button className="icon-btn" style={{ width: '1.75rem', height: '1.75rem' }} aria-label={`Remove step: ${step.name}`} onClick={() => update({ subtasks: subtasks.filter(x => x.id !== step.id) })}><i className="fas fa-times text-xs"></i></button>

        // ------------------------------------------------------------------
        // Settings
        // ------------------------------------------------------------------
        function SettingRow({ title, description, children }) {
            return (
                <div className="flex items-center justify-between gap-4 py-3">
                    <div className="min-w-0">
                        <p className="font-bold text-sm">{title}</p>

        function SettingsModal({ onClose }) {
            const s = useStore();
            const { prefs, updatePrefs, user, userProfile } = s;
            const [photo, setPhoto] = useState(userProfile?.photoURL || null);
            const [displayName, setDisplayName] = useState(userProfile?.displayName || '');
            const [profileError, setProfileError] = useState('');
            const [saving, setSaving] = useState(false);
            const profileChanged = user && (photo !== (userProfile?.photoURL || null) || displayName !== (userProfile?.displayName || ''));

            const handlePhoto = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                try {
                    setProfileError('');
                    setPhoto(await resizeImage(file, 256));
                } catch (err) {
                    setProfileError(err.message);
                }
            };
            const saveProfile = async () => {
                setSaving(true);
                setProfileError('');
                try {
                    const data = { photoURL: photo, displayName: displayName.trim() || user.email?.split('@')[0] || 'Friend', email: user.email || null };
                    await db.collection('users').doc(user.uid).collection('profile').doc('info').set({ ...data, updatedAt: serverTime() }, { merge: true });
                    s.setUserProfile(data);
                    s.showToast({ message: 'Profile saved' });
                } catch (err) {
                    console.error('Error updating profile:', err);
                    setProfileError('We couldn’t save your profile. Please try again.');
                } finally {
                    setSaving(false);
                }
            };
            const toggleDesktop = async (on) => {
                if (!on) { updatePrefs({ desktopNotifications: false }); return; }
                if (!('Notification' in window)) { s.showToast({ message: 'This browser doesn’t support desktop notifications', icon: 'fa-info-circle' }); return; }
                const permission = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
                if (permission === 'granted') updatePrefs({ desktopNotifications: true });
                else s.showToast({ message: 'Notifications are blocked in your browser settings', icon: 'fa-info-circle' });
            };
            const exportData = () => {
                const blob = new Blob([JSON.stringify({ app: 'EveryMango', exportedAt: new Date().toISOString(), boards: s.boards, team: s.team }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `everymango-backup-${todayStr()}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            const numberSelect = (value, options, onChange, suffix, label) => (
                <select value={value} onChange={(e) => onChange(Number(e.target.value))} className="field" style={{ width: 'auto' }} aria-label={label}>
                    {options.map(o => <option key={o} value={o}>{o} {suffix}</option>)}
                </select>
            );

            return (
                <Modal onClose={onClose} wide label="Settings">
                    <div className="px-6 py-4 flex items-center justify-between border-b sticky top-0 bg-white z-10" style={{ borderColor: 'var(--linen)' }}>
                        <h3 className="text-xl font-bold">Settings 🥭</h3>
                        <button className="icon-btn" onClick={onClose} aria-label="Close settings"><i className="fas fa-times"></i></button>
                    </div>
                    <div className="p-6 space-y-8">
                        {user && (
                            <section>
                                <h4 className="label">Profile</h4>
                                <div className="flex items-center gap-4">
                                    <Avatar avatar={photo} name={displayName || user.email} size={72} />
                                    <div className="flex-1 min-w-0 space-y-2">
                                        <input type="text" value={displayName} onChange={(e) => setDisplayName(e.target.value)} placeholder="Your name" aria-label="Display name" className="field" />
                                        <div className="flex flex-wrap items-center gap-2">
                                            <label className="btn btn-soft btn-sm cursor-pointer">
                                                <i className="fas fa-upload"></i>{photo ? 'Change photo' : 'Upload photo'}
                                                <input type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
                                            </label>
                                            {photo && <button className="btn btn-ghost btn-sm" onClick={() => setPhoto(null)}>Remove</button>}
                                            <span className="text-xs truncate" style={{ color: 'var(--muted)' }}>{user.email}</span>
                                        </div>
                                    </div>
                                </div>
                                {profileError && <p className="text-xs mt-2 font-semibold" style={{ color: '#A93A2F' }}>{profileError}</p>}
                                {profileChanged && (
                                    <button className="btn btn-primary btn-sm mt-3" onClick={saveProfile} disabled={saving}>
                                        {saving ? <><i className="fas fa-spinner fa-spin"></i>Saving…</> : <><i className="fas fa-save"></i>Save profile</>}
                                    </button>
                                )}
                            </section>
                        )}

                        <section>
                            <h4 className="label">How EveryMango talks to you</h4>
                            <div className="divide-y" style={{ borderColor: 'var(--linen)' }}>
                                <SettingRow title="Gentle Mode" description="“3 days overdue” becomes “3 days ago”. Softer words, same tasks.">
                                    <Toggle on={s.gentle} onChange={s.setGentle} label="Gentle Mode" />
                                </SettingRow>
                                <SettingRow title="Reminder pop-ups" description="A nudge for what’s planned today, tomorrow, and any reminder times you set.">
                                    <Toggle on={s.notificationsEnabled} onChange={s.setNotificationsEnabled} label="Reminder pop-ups" />
                                </SettingRow>
                                <SettingRow title="Desktop notifications" description="Also notify me when EveryMango is in a background tab.">
                                    <Toggle on={!!prefs.desktopNotifications} onChange={toggleDesktop} label="Desktop notifications" />
                                </SettingRow>
                            </div>
                        </section>

                        <section>
                            <h4 className="label">Your rhythm</h4>
                            <div className="divide-y" style={{ borderColor: 'var(--linen)' }}>
                                <SettingRow title="Focus session" description="How long one focus timer runs.">
                                    {numberSelect(prefs.focusMin, [10, 15, 20, 25, 30, 45, 50, 60], (v) => updatePrefs({ focusMin: v }), 'min', 'Focus session length')}
                                </SettingRow>
                                <SettingRow title="Break" description="Rest between sessions.">
                                    {numberSelect(prefs.breakMin, [3, 5, 10, 15, 20], (v) => updatePrefs({ breakMin: v }), 'min', 'Break length')}
                                </SettingRow>
                                <SettingRow title="Daily time budget" description="Roughly how many hours of tasks fit in your day.">
                                    {numberSelect(prefs.dailyHours, [2, 3, 4, 5, 6, 7, 8, 9, 10, 12], (v) => updatePrefs({ dailyHours: v }), 'hours', 'Daily time budget')}
                                </SettingRow>
                            </div>
                        </section>

                        <section>
                            <h4 className="label">Shortcuts</h4>
                            <p className="text-sm leading-7" style={{ color: 'var(--muted)' }}>
                                <kbd>/</kbd> jump to Brain Dump &nbsp;·&nbsp; <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> search &nbsp;·&nbsp; <kbd>Esc</kbd> close a panel
                            </p>
                        </section>

                        <section>
                            <h4 className="label">Your data</h4>
                            <div className="flex flex-wrap gap-3">
                                <button className="btn btn-outline btn-sm" onClick={exportData}><i className="fas fa-download"></i>Download a backup</button>
                                {user && <button className="btn btn-soft btn-sm" onClick={s.onSignOut}><i className="fas fa-sign-out-alt"></i>Sign out</button>}
                                {s.demo && <a className="btn btn-primary btn-sm" href={window.location.pathname}><i className="fas fa-user-plus"></i>Create a free account</a>}
                            </div>
                            {s.demo && <p className="text-xs mt-2" style={{ color: 'var(--muted)' }}>You’re in the demo. Changes are kept in this browser only.</p>}
                        </section>
                    </div>
                </Modal>
            );
        }

        // ------------------------------------------------------------------
        // Shared view pieces
        // ------------------------------------------------------------------
        function ViewHeader({ title, subtitle, children }) {
            return (
                <div className="px-4 sm:px-8 pt-5 pb-4 flex flex-wrap items-end justify-between gap-3">
                    <div className="min-w-0">
                        <h2 className="text-2xl sm:text-3xl font-bold">{title}</h2>
                        {subtitle && <p className="text-sm font-medium mt-1" style={{ color: 'var(--muted)' }}>{subtitle}</p>}
                    </div>
                    {children}
                </div>
            );
        }

        function ListCard({ title, icon, iconColor, count, action, children, tone }) {
            return (
                <section className="card-gentle shadow-soft overflow-hidden">
                    <div className="px-4 py-3 flex items-center justify-between gap-3" style={{ background: tone || 'var(--cream-dark)' }}>
                        <h3 className="font-bold flex items-center gap-2 min-w-0">
                            {icon && <i className={`fas ${icon}`} style={{ color: iconColor || 'var(--sage)' }} aria-hidden="true"></i>}
                            <span className="truncate">{title}</span>
                            {count !== undefined && <span className="text-xs font-bold px-2 py-0.5 rounded-lg bg-white" style={{ color: 'var(--muted)' }}>{count}</span>}

                        {action}
                    </div>
                    <div className="task-list">{children}</div>
                </section>
