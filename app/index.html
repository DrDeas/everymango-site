        }

        function TimeBudget({ minutes, compact = false }) {
            const { prefs } = useStore();
            const available = prefs.dailyHours * 60;
            const pct = Math.min((minutes / available) * 100, 100);
            const over = minutes > available;
            return (
                <div className={compact ? '' : 'card-gentle shadow-soft p-4'}>
                    <div className="flex items-center justify-between text-sm font-bold mb-2">
                        <span><i className="fas fa-hourglass-half mr-2" style={{ color: 'var(--sage)' }}></i>Today’s time budget</span>
                        <span style={{ color: 'var(--muted)' }}>{formatMinutes(minutes)} of {prefs.dailyHours}h</span>
                    </div>
                    <div className="w-full h-2.5 rounded-full" style={{ background: 'var(--linen)' }} role="progressbar" aria-valuenow={Math.round(pct)} aria-valuemin="0" aria-valuemax="100">
                        <div className="h-2.5 rounded-full" style={{ width: `${pct}%`, background: over ? 'var(--ripe-mango)' : pct > 80 ? 'var(--golden-flesh)' : 'var(--sanctuary-sage)', transition: 'width .4s ease' }}></div>
                    </div>
                    {over && (
                        <p className="text-xs mt-2 font-semibold" style={{ color: '#9A5A1E' }}>
                            That’s {formatMinutes(minutes - available)} more than fits today. It’s okay to move something to tomorrow — mangoes take their time 🥭
                        </p>
                    )}
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Today — the calm home screen
        // ------------------------------------------------------------------
        function TodayView() {
            const s = useStore();
            const today = todayStr();
            const [showDone, setShowDone] = useState(false);
            const [suggestionId, setSuggestionId] = useState(null);
            const [skipped, setSkipped] = useState([]);

            const actionable = s.allTasks.filter(isActionable);
            const focusFilter = (t) => !s.focusMode || t.isFocusTask;
            const order = (a, b) => (b.isFocusTask - a.isFocusTask) || ((a.timeBlock || '99') < (b.timeBlock || '99') ? -1 : (a.timeBlock || '99') > (b.timeBlock || '99') ? 1 : 0);
            const dueTodayAll = actionable.filter(t => t.dueDate === today);
            const dueToday = dueTodayAll.filter(focusFilter).sort(order);
            const carried = s.overdueTasks.filter(focusFilter).sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
            const starred = actionable.filter(t => t.isFocusTask && t.dueDate !== today && !(t.dueDate && t.dueDate < today));
            const doneToday = s.allTasks.filter(t => t.status === 'done' && t.completedAt && toDateStr(new Date(t.completedAt)) === today);
            const inboxCount = s.allTasks.filter(t => t.boardId === BRAIN_DUMP_BOARD_ID && isOpen(t) && !t.dueDate).length;
            const plannedMinutes = dueTodayAll.reduce((sum, t) => sum + getTimeInMinutes(t.timeEstimate), 0);
            const totalToday = doneToday.length + dueTodayAll.length;
            const pct = totalToday ? Math.round((doneToday.length / totalToday) * 100) : 0;

            const hour = new Date().getHours();
            const greeting = hour < 5 ? 'Hello, night owl' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
            const firstName = s.demo ? '' : ((s.userProfile?.displayName || '').split(' ')[0] || '');
            const dateLabel = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            // "Pick one for me": removes the where-do-I-start decision.
            const pickOne = (exclude = skipped) => {
                let pool = [...dueTodayAll, ...s.overdueTasks, ...starred];
                if (!pool.length) pool = actionable.filter(t => t.boardId !== BRAIN_DUMP_BOARD_ID);
                pool = pool.filter((t, i, arr) => arr.findIndex(x => x.id === t.id) === i);
                let candidates = pool.filter(t => !exclude.includes(t.id));
                if (!candidates.length) { candidates = pool; exclude = []; }
                if (!candidates.length) { s.showToast({ message: 'Nothing waiting on you right now. Enjoy the breathing room 🥭', icon: 'fa-leaf' }); return; }
                const energy = s.energyToday;
                const score = (t) => {
                    let n = Math.random();
                    if (energy && ENERGY_RANK[t.energyLevel] <= ENERGY_RANK[energy]) n += 3;
                    if (t.status === 'working') n += 2;
                    if (t.isFocusTask) n += 2;
                    if (t.dueDate === today) n += 1;
                    if (isQuickWin(t)) n += energy === 'low' ? 3 : 1;
                    return n;
                };
                const best = candidates.map(t => ({ t, n: score(t) })).sort((a, b) => b.n - a.n)[0].t;
                setSkipped(exclude);
                setSuggestionId(best.id);
            };
            const suggestion = suggestionId ? actionable.find(t => t.id === suggestionId) : null;

            const nothingPlanned = dueToday.length === 0 && carried.length === 0;

            return (
                <div className="flex-1 overflow-y-auto scrollbar-thin">
                    <div className="max-w-3xl mx-auto px-4 sm:px-8 py-6 space-y-5">
                        {/* Greeting */}
                        <div className="flex items-center justify-between gap-4">
                            <div className="min-w-0">
                                <p className="text-sm font-bold uppercase tracking-wider" style={{ color: 'var(--muted)' }}>{dateLabel}</p>
                                <h2 className="text-2xl sm:text-3xl font-bold mt-1">{greeting}{firstName ? `, ${firstName}` : ''} 🥭</h2>
                                <p className="text-sm font-medium mt-1" style={{ color: 'var(--muted)' }}>
                                    {totalToday === 0 ? 'Nothing is scheduled for today. Ripen at your own pace.'
                                        : dueTodayAll.length === 0 ? `Everything planned for today is done — ${doneToday.length} win${doneToday.length === 1 ? '' : 's'}. Rest counts too.`
                                        : `${dueTodayAll.length} thing${dueTodayAll.length === 1 ? '' : 's'} planned${doneToday.length ? `, ${doneToday.length} already done` : ''}. One at a time.`}
                                </p>
                            </div>
                            <ProgressRing value={pct} size={76} stroke={7}>
                                <span className="text-sm font-bold" aria-label={`${doneToday.length} of ${totalToday} done today`}>{doneToday.length}/{totalToday}</span>
                            </ProgressRing>
                        </div>

                        {/* Energy check-in + pick one */}
                        <div className="card-gentle shadow-soft p-4">
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-sm font-bold mr-1">How’s your energy?</span>
                                    {ENERGY_OPTS.map(o => (
                                        <button key={o.value} className={`opt ${s.energyToday === o.value ? 'active' : ''}`} aria-pressed={s.energyToday === o.value}
                                            onClick={() => s.updatePrefs(s.energyToday === o.value ? { energy: null, energyDate: '' } : { energy: o.value, energyDate: today })}>
                                            <i className={`fas ${o.icon} mr-1.5`}></i>{o.label}
                                        </button>
                                    ))}
                                </div>
                                <button className="btn btn-mango" onClick={() => pickOne()}><i className="fas fa-wand-magic-sparkles"></i>Pick one for me</button>
                            </div>
                            {s.energyToday && !suggestion && (
                                <p className="text-xs mt-3 font-semibold" style={{ color: 'var(--muted)' }}>
                                    {s.energyToday === 'low' ? 'Low-energy day noted. Quick wins and easy tasks will be suggested first — small counts.' : s.energyToday === 'high' ? 'Lovely. A good day to take on something meatier.' : 'Steady it is. We’ll suggest things that fit.'}
                                </p>
                            )}
                            {suggestion && (
                                <div className="mt-4 p-4 rounded-2xl pop-in" style={{ background: 'rgba(244, 162, 89, 0.14)', border: '2px solid var(--ripe-mango)' }}>
                                    <p className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: '#9A5A1E' }}>How about this one?</p>
                                    <p className="text-lg font-bold" style={{ fontFamily: 'Quicksand, sans-serif' }}>{suggestion.name}</p>
                                    <p className="text-xs font-semibold mt-1" style={{ color: 'var(--muted)' }}>
                                        {suggestion.boardName} · about {formatMinutes(getTimeInMinutes(suggestion.timeEstimate))} · {suggestion.energyLevel} energy
                                    </p>
                                    {suggestion.whyItMatters && <p className="text-sm mt-2 italic"><i className="fas fa-heart mr-1.5" style={{ color: 'var(--ripe-mango)' }}></i>{suggestion.whyItMatters}</p>}
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        <button className="btn btn-primary btn-sm" onClick={() => { s.startPomodoro(suggestion.id); setSuggestionId(null); }}><i className="fas fa-play"></i>Start {s.prefs.focusMin} min</button>
                                        <button className="btn btn-outline btn-sm" onClick={() => s.openTask(suggestion.id)}>Open</button>
                                        <button className="btn btn-ghost btn-sm" onClick={() => pickOne([...skipped, suggestion.id])}><i className="fas fa-shuffle"></i>Something else</button>
                                        <button className="btn btn-ghost btn-sm" onClick={() => setSuggestionId(null)}>Not now</button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Carried over */}
                        {carried.length > 0 && (
                            <ListCard title={s.gentle ? 'Carried over' : 'Overdue'} icon="fa-seedling" iconColor="#C98A2B" count={carried.length} tone="rgba(248, 197, 109, 0.28)"
                                action={<button className="btn btn-sm btn-mango" onClick={s.rolloverAllOverdue} title="Move all of these to today"><i className="fas fa-sun"></i>Fresh Start</button>}>
                                <p className="px-4 py-2 text-xs font-semibold" style={{ color: 'var(--muted)', background: '#fff' }}>
                                    {s.gentle ? 'These slipped past their date — no judgment. Bring them into today, or open one and send it to Someday.' : 'These are past their due date. Move them to today or reschedule.'}
                                </p>
                                {carried.map(t => <TaskRow key={t.id} task={t} showBoard />)}
                            </ListCard>
                        )}

                        {/* Today */}
                        <ListCard title="Today" icon="fa-sun" iconColor="var(--ripe-mango)" count={dueToday.length}
                            action={dueTodayAll.length > 0 && <button className="btn btn-sm btn-ghost" onClick={() => s.navigate('timeblocking')}><i className="fas fa-clock"></i>Plan the day</button>}>
                            {dueToday.map(t => <TaskRow key={t.id} task={t} showBoard />)}
                            {nothingPlanned && (
                                <EmptyState icon={s.focusMode ? 'fa-star' : 'fa-leaf'} title={s.focusMode ? 'No starred tasks for today' : 'A clear day'}>
                                    {s.focusMode ? 'Star a task to see it here, or switch Focus off.' : 'Add something below, or pick from your boards. Or don’t — rest is productive too.'}
                                </EmptyState>
                            )}
                            <QuickAdd placeholder="Add a task for today…" onAdd={(name) => s.captureThought(name, { dueDate: today })} />
                        </ListCard>

                        {dueTodayAll.length > 0 && <TimeBudget minutes={plannedMinutes} />}

                        {/* Starred, undated */}
                        {starred.length > 0 && (
                            <ListCard title="Starred for later" icon="fa-star" iconColor="var(--ripe-mango)" count={starred.length}>
                                {starred.map(t => <TaskRow key={t.id} task={t} showBoard />)}
                            </ListCard>
                        )}

                        {/* Inbox nudge */}
                        {inboxCount > 0 && !s.focusMode && (
                            <button onClick={() => s.navigate('board', BRAIN_DUMP_BOARD_ID)} className="card-gentle shadow-soft w-full p-4 flex items-center gap-3 text-left hover:border-[color:var(--ripe-mango)]">
                                <span className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(244, 162, 89, 0.2)' }}><i className="fas fa-brain" style={{ color: 'var(--ripe-mango)' }}></i></span>
                                <span className="flex-1 min-w-0">
                                    <span className="block font-bold">{inboxCount} captured thought{inboxCount === 1 ? '' : 's'} in your Brain Dump</span>
                                    <span className="block text-xs" style={{ color: 'var(--muted)' }}>Sort them when you have bandwidth. They’re safe until then.</span>
                                </span>
                                <i className="fas fa-chevron-right" style={{ color: 'var(--warm-gray)' }}></i>
                            </button>
                        )}

                        {/* Wins */}
                        {doneToday.length > 0 && (
                            <ListCard title="Done today 🎉" icon="fa-check-circle" count={doneToday.length} tone="rgba(168, 181, 160, 0.3)"
                                action={<button className="btn btn-sm btn-ghost" onClick={() => setShowDone(!showDone)} aria-expanded={showDone}>{showDone ? 'Hide' : 'Show'}</button>}>
                                {showDone && doneToday.map(t => <TaskRow key={t.id} task={t} showBoard />)}
                            </ListCard>
                        )}
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Board view
        // ------------------------------------------------------------------
        function EditableText({ value, onSave, className, style, startEditing = false, onDone, disabled = false, label }) {
            const [editing, setEditing] = useState(startEditing);
            const [text, setText] = useState(value);
            useEffect(() => { if (!editing) setText(value); }, [value, editing]);
            const finish = () => {
                const next = text.trim();
                if (next && next !== value) onSave(next);
                setEditing(false);
                if (onDone) onDone();
            };
            if (editing && !disabled) {
                return (
                    <input autoFocus value={text} aria-label={label} onChange={(e) => setText(e.target.value)} onBlur={finish} onFocus={(e) => e.target.select()}
                        onKeyDown={(e) => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') { e.stopPropagation(); setText(value); setEditing(false); if (onDone) onDone(); } }}
                        className={`${className} bg-transparent border-b-2 min-w-0 w-full`} style={{ ...style, borderColor: 'var(--mango-leaf)', boxShadow: 'none' }} />
                );
            }
            return (
                <span className={`${className} ${disabled ? '' : 'cursor-text hover:opacity-70'} truncate`} style={style} title={disabled ? undefined : 'Click to rename'}
                    role={disabled ? undefined : 'button'} tabIndex={disabled ? undefined : 0} aria-label={disabled ? undefined : `${label}: ${value}. Click to rename`}
                    onClick={() => !disabled && setEditing(true)} onKeyDown={(e) => { if (!disabled && e.key === 'Enter') setEditing(true); }}>
                    {value}
                </span>
            );
        }

        function BoardView({ board }) {
            const s = useStore();
            const [showColors, setShowColors] = useState(false);
            const isSystem = isSystemBoardId(board.id);
            const isBrainDump = board.id === BRAIN_DUMP_BOARD_ID;
            const isSomeday = board.id === SOMEDAY_MAYBE_BOARD_ID;
            const tasks = board.groups.flatMap(g => g.tasks);
            const completed = tasks.filter(t => t.status === 'done').length;
            const pct = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;
            const quickWins = tasks.filter(t => isOpen(t) && isQuickWin(t)).length;
            const filtersOn = s.quickWinsOnly || s.energyFilter;
            const matches = (t) => (!s.focusMode || t.isFocusTask) && (!s.quickWinsOnly || isQuickWin(t)) && (!s.energyFilter || t.energyLevel === s.energyFilter);
            const anyMatch = tasks.some(t => isOpen(t) && matches(t));
            const narrowing = s.focusMode || filtersOn;

            useEffect(() => setShowColors(false), [board.id]);

            return (
                <div className="flex-1 flex flex-col overflow-hidden">
                    <div className="px-4 sm:px-8 pt-5 pb-3">
                        <div className="flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <ProgressRing value={pct} size={48} stroke={5} color={board.color}>
                                    <span className="text-[11px] font-bold">{pct}%</span>
                                </ProgressRing>
                                <div className="min-w-0 flex flex-col">
                                    <EditableText key={board.id} value={board.name} label="Board name" disabled={isSystem} className="text-2xl sm:text-3xl font-bold" style={{ fontFamily: 'Quicksand, sans-serif' }}
                                        startEditing={s.renameBoardId === board.id} onDone={() => s.setRenameBoardId(null)} onSave={(name) => s.updateBoard(board.id, { name })} />
                                    <span className="text-xs font-semibold" style={{ color: 'var(--muted)' }}>
                                        {isBrainDump ? 'Capture now, sort later.' : isSomeday ? 'Not forgotten — just ripening.' : `${completed} of ${tasks.length} done`}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1 flex-shrink-0">
                                <button className="btn btn-outline btn-sm" onClick={() => s.addGroup(board.id)}><i className="fas fa-plus"></i><span className="hidden sm:inline">Add group</span></button>
                                {!isSystem && (
                                    <>
                                        <div className="relative">
                                            <button className="icon-btn" onClick={() => setShowColors(!showColors)} aria-label="Change board color" aria-expanded={showColors} title="Board color">
                                                <span className="w-4 h-4 rounded-full" style={{ background: board.color, boxShadow: '0 0 0 2px #fff, 0 0 0 3px var(--linen)' }}></span>
                                            </button>
                                            {showColors && (
                                                <div className="absolute right-0 top-full mt-2 z-20 bg-white rounded-2xl shadow-soft-lg border p-3 flex gap-2 pop-in" style={{ borderColor: 'var(--linen)' }}>
                                                    {BOARD_COLORS.map(c => (
                                                        <button key={c} aria-label={`Use color ${c}`} onClick={() => { s.updateBoard(board.id, { color: c }); setShowColors(false); }}
                                                            className="w-7 h-7 rounded-full" style={{ background: c, boxShadow: board.color === c ? '0 0 0 2px #fff, 0 0 0 4px var(--charcoal)' : 'none' }}></button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <button className="icon-btn" onClick={() => s.updateBoard(board.id, { isPinned: !board.isPinned })} aria-pressed={!!board.isPinned} aria-label={board.isPinned ? 'Unpin board' : 'Pin board to top'} title={board.isPinned ? 'Unpin board' : 'Pin board to top'}>
                                            <i className="fas fa-thumbtack" style={{ color: board.isPinned ? 'var(--ripe-mango)' : undefined }}></i>
                                        </button>
                                        <button className="icon-btn" onClick={() => s.deleteBoard(board.id)} aria-label="Delete board" title="Delete board"><i className="fas fa-trash"></i></button>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 mt-4">
                            <button className={`opt ${s.quickWinsOnly ? 'active-yellow' : ''}`} aria-pressed={s.quickWinsOnly} onClick={() => s.setQuickWinsOnly(!s.quickWinsOnly)}>
                                <i className="fas fa-bolt mr-1.5"></i>Quick wins ({quickWins})
                            </button>
                            <span className="text-xs font-bold ml-1" style={{ color: 'var(--muted)' }}>Energy:</span>
                            {ENERGY_OPTS.map(o => (
                                <button key={o.value} className={`opt ${s.energyFilter === o.value ? 'active' : ''}`} aria-pressed={s.energyFilter === o.value}
                                    onClick={() => s.setEnergyFilter(s.energyFilter === o.value ? null : o.value)}>{o.label}</button>
                            ))}
                            {filtersOn && <button className="btn btn-ghost btn-sm" onClick={() => { s.setQuickWinsOnly(false); s.setEnergyFilter(null); }}><i className="fas fa-times"></i>Clear</button>}
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto px-4 sm:px-8 pb-24 scrollbar-thin">
                        <div className="space-y-5 max-w-5xl">
                            {narrowing && !anyMatch && tasks.some(isOpen) && (
                                <div className="card-gentle">
                                    <EmptyState icon={s.focusMode ? 'fa-star' : 'fa-filter'} title={s.focusMode ? 'No starred tasks here' : 'Nothing matches those filters'}>
                                        {s.focusMode ? 'Star the tasks that matter most right now and they’ll show up in Focus.' : 'Try a different energy level, or clear the filters.'}
                                    </EmptyState>
                                </div>
                            )}
                            {board.groups.map(group => (
                                <GroupSection key={group.id} group={group} board={board} matches={matches} narrowing={narrowing} triage={isBrainDump} />
                            ))}
                            {board.groups.length === 0 && (
                                <div className="card-gentle">
                                    <EmptyState title="This board is empty">
                                        <button className="btn btn-primary mt-3" onClick={() => s.addGroup(board.id)}><i className="fas fa-plus"></i>Add a group</button>
                                    </EmptyState>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function GroupSection({ group, board, matches, narrowing, triage }) {
            const s = useStore();
            const [collapsed, setCollapsed] = useState(false);
            const [showDone, setShowDone] = useState(false);
            const open = group.tasks.filter(t => isOpen(t) && matches(t));
            const done = group.tasks.filter(t => t.status === 'done' && matches(t));
            const pct = group.tasks.length ? Math.round((group.tasks.filter(t => t.status === 'done').length / group.tasks.length) * 100) : 0;
            if (narrowing && open.length === 0) return null;

            return (
                <section className="card-gentle shadow-soft overflow-hidden" style={{ borderLeft: `5px solid ${group.color}` }}>
                    <div className="px-3 py-2.5 flex items-center justify-between gap-2" style={{ background: 'linear-gradient(90deg, var(--cream-dark) 0%, #fff 100%)' }}>
                        <div className="flex items-center gap-2 min-w-0 flex-1">
                            <button onClick={() => setCollapsed(!collapsed)} className="icon-btn" aria-expanded={!collapsed} aria-label={collapsed ? `Expand ${group.name}` : `Collapse ${group.name}`}>
                                <i className={`fas fa-chevron-${collapsed ? 'right' : 'down'} text-xs`}></i>
                            </button>
                            <EditableText value={group.name} label="Group name" className="font-bold text-lg" style={{ fontFamily: 'Quicksand, sans-serif' }} onSave={(name) => s.updateGroup(board.id, group.id, { name })} />
                            <span className="text-xs font-bold px-2 py-0.5 rounded-lg flex-shrink-0" style={{ background: 'var(--linen)', color: 'var(--muted)' }}>{open.length}</span>
                        </div>
                        <div className="flex items-center gap-2 flex-shrink-0">
                            {group.tasks.length > 0 && (
                                <div className="hidden sm:flex items-center gap-2" title={`${pct}% done`}>
                                    <div className="w-20 h-1.5 rounded-full" style={{ background: 'var(--linen)' }}>
                                        <div className="h-1.5 rounded-full" style={{ width: `${pct}%`, background: 'var(--sanctuary-sage)', transition: 'width .4s ease' }}></div>
                                    </div>
                                    <span className="text-xs font-bold" style={{ color: 'var(--muted)' }}>{pct}%</span>
                                </div>
                            )}
                            {!(isSystemBoardId(board.id) && board.groups.length === 1) && (
                                <button className="icon-btn" onClick={() => s.deleteGroup(board.id, group.id)} aria-label={`Delete group ${group.name}`} title="Delete group"><i className="fas fa-trash text-xs"></i></button>
                            )}
                        </div>
                    </div>

                    {!collapsed && (
                        <div className="task-list border-t" style={{ borderColor: 'var(--linen)' }}>
                            {open.map(task => <TaskRow key={task.id} task={task} triage={triage} />)}
                            {open.length === 0 && done.length === 0 && !narrowing && (
                                <p className="px-4 py-4 text-sm" style={{ color: 'var(--muted)', background: '#fff' }}>
                                    {triage ? 'Nothing waiting to be sorted. Use the Brain Dump bar up top whenever a thought pops in.' : board.id === SOMEDAY_MAYBE_BOARD_ID ? 'Park ideas here that aren’t ready yet. No pressure, no dates.' : 'Nothing here yet. Add your first task below.'}
                                </p>
                            )}
                            {!narrowing && <QuickAdd placeholder={triage ? 'Capture a thought…' : 'Add a task…'} onAdd={(name) => s.addTask(board.id, group.id, { name })} />}
                            {done.length > 0 && (
                                <div style={{ background: '#fff' }}>
                                    <button className="w-full text-left px-4 py-2.5 text-sm font-bold flex items-center gap-2" style={{ color: 'var(--muted)' }} onClick={() => setShowDone(!showDone)} aria-expanded={showDone}>
                                        <i className={`fas fa-chevron-${showDone ? 'down' : 'right'} text-xs`}></i>
                                        <i className="fas fa-check-circle" style={{ color: 'var(--sage)' }}></i>{done.length} done
                                    </button>
                                    {showDone && <div className="task-list border-t" style={{ borderColor: 'var(--linen)' }}>{done.map(task => <TaskRow key={task.id} task={task} />)}</div>}
                                </div>
                            )}
                        </div>
                    )}
                </section>
            );
        }

        // ------------------------------------------------------------------
        // Time Blocking
        // ------------------------------------------------------------------
        const TIME_SLOTS = Array.from({ length: 17 }, (_, i) => `${pad2(i + 6)}:00`);

        function TimeBlockingView() {
            const s = useStore();
            const today = todayStr();
            const [dragOver, setDragOver] = useState(null);
            const todays = s.allTasks.filter(t => t.dueDate === today && t.boardId !== SOMEDAY_MAYBE_BOARD_ID);
            const unscheduled = todays.filter(t => !t.timeBlock && isOpen(t));
            const scheduled = todays.filter(t => t.timeBlock);
            const plannedMinutes = todays.filter(isOpen).reduce((sum, t) => sum + getTimeInMinutes(t.timeEstimate), 0);
            const nowSlot = `${pad2(new Date().getHours())}:00`;
            const nowRef = useRef(null);
            useEffect(() => { if (nowRef.current) nowRef.current.scrollIntoView({ block: 'center' }); }, []);

            const schedule = (taskId, slot) => s.updateTask(taskId, { timeBlock: slot });
            const onDrop = (e, slot) => {
                e.preventDefault();
                setDragOver(null);
                const id = e.dataTransfer.getData('text/plain');
                if (id) schedule(id, slot);
            };

            return (
                <div className="flex-1 flex flex-col overflow-hidden">
                    <ViewHeader title="Time Blocking" subtitle="Give today’s tasks a home in your day. Plans change — just move things. 🥭" />
                    <div className="flex-1 overflow-hidden flex flex-col lg:flex-row border-t" style={{ borderColor: 'var(--linen)' }}>
                        <div className="lg:w-80 flex-shrink-0 border-b lg:border-b-0 lg:border-r p-4 overflow-y-auto scrollbar-thin max-h-[38vh] lg:max-h-none" style={{ borderColor: 'var(--linen)', background: 'var(--cream-dark)' }}
                            onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id) schedule(id, null); }}>
                            <h3 className="font-bold mb-3"><i className="fas fa-inbox mr-2" style={{ color: 'var(--sage)' }}></i>Unscheduled ({unscheduled.length})</h3>
                            <div className="space-y-3">
                                {unscheduled.map(task => (
                                    <div key={task.id} draggable onDragStart={(e) => { e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.effectAllowed = 'move'; }}
                                        className={`card-gentle shadow-soft p-3 draggable-task type-${task.taskType}`} style={{ borderLeft: '4px solid var(--type-color)' }}>
                                        <button className="font-bold text-sm text-left w-full" onClick={() => s.openTask(task.id)}>{task.name}</button>
                                        <div className="flex items-center justify-between gap-2 mt-2">
                                            <span className="chip"><i className="far fa-clock"></i>{TIME_OPTS.find(t => t.value === task.timeEstimate)?.label} · {task.energyLevel}</span>
                                            <select value="" onChange={(e) => e.target.value && schedule(task.id, e.target.value)} aria-label={`Schedule “${task.name}”`}
                                                className="text-xs font-bold rounded-lg py-1.5 pl-2 border-2" style={{ borderColor: 'var(--linen)', background: '#fff' }}>
                                                <option value="">Schedule…</option>
                                                {TIME_SLOTS.map(slot => <option key={slot} value={slot}>{formatTime(slot)}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                ))}
                                {unscheduled.length === 0 && (
                                    <p className="text-sm py-4 text-center" style={{ color: 'var(--muted)' }}>
                                        {todays.length === 0 ? 'Nothing is set for today yet. Give a task today’s date and it will show up here.' : 'Everything for today has a slot ✓'}
                                    </p>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 sm:p-6 scrollbar-thin">
                            <div className="max-w-3xl">
                                <TimeBudget minutes={plannedMinutes} />
                                <div className="mt-5 space-y-2">
                                    {TIME_SLOTS.map(slot => {
                                        const inSlot = scheduled.filter(t => t.timeBlock === slot);
                                        const isNow = slot === nowSlot;
                                        return (
                                            <div key={slot} className="flex items-stretch gap-3" ref={isNow ? nowRef : null}>
                                                <span className="text-xs font-bold w-14 pt-3 text-right flex-shrink-0" style={{ color: isNow ? '#9A5A1E' : 'var(--muted)' }}>
                                                    {formatTime(slot)}{isNow && <span className="block text-[10px] uppercase tracking-wider">now</span>}
                                                </span>
                                                <div className={`flex-1 min-w-0 time-slot p-2 ${inSlot.length ? 'occupied' : ''} ${isNow ? 'now' : ''} ${dragOver === slot ? 'drag-over' : ''}`}
                                                    onDragOver={(e) => { e.preventDefault(); setDragOver(slot); }} onDragLeave={() => setDragOver(d => d === slot ? null : d)} onDrop={(e) => onDrop(e, slot)}>
                                                    {inSlot.length === 0 ? (
                                                        <div className="h-full flex items-center justify-center text-xs font-semibold py-2" style={{ color: '#A39C94' }}>Free</div>
                                                    ) : (
                                                        <div className="space-y-2">
                                                            {inSlot.map(task => {
                                                                const timing = s.pomo && s.pomo.taskId === task.id;
                                                                const done = task.status === 'done';
                                                                return (
                                                                    <div key={task.id} draggable onDragStart={(e) => { e.dataTransfer.setData('text/plain', task.id); }}
                                                                        className={`bg-white rounded-xl border px-3 py-2 flex items-center gap-2 draggable-task type-${task.taskType}`} style={{ borderColor: 'var(--linen)', borderLeft: '4px solid var(--type-color)' }}>
                                                                        <button className={`check ${done ? 'checked' : ''}`} style={{ marginTop: 0 }} onClick={() => s.toggleDone(task.id)} aria-pressed={done} aria-label={`Mark “${task.name}” done`}><i className="fas fa-check"></i></button>
                                                                        <button className={`flex-1 min-w-0 text-left font-bold text-sm truncate ${done ? 'line-through opacity-50' : ''}`} onClick={() => s.openTask(task.id)}>{task.name}</button>
                                                                        <span className="chip hidden sm:inline-flex">{TIME_OPTS.find(t => t.value === task.timeEstimate)?.label}</span>
                                                                        {!done && (
                                                                            <button className="icon-btn" onClick={() => timing ? s.stopPomodoro() : s.startPomodoro(task.id)} aria-label={timing ? 'Stop focus timer' : 'Start focus timer'}
                                                                                style={timing ? { background: 'var(--ripe-mango)', color: '#fff' } : { color: 'var(--mango-leaf)' }}>
                                                                                <i className={`fas ${timing ? 'fa-stop' : 'fa-play'} text-xs`}></i>
                                                                            </button>
                                                                        )}
                                                                        <button className="icon-btn" onClick={() => schedule(task.id, null)} aria-label="Remove from this time slot" title="Unschedule"><i className="fas fa-times text-xs"></i></button>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Timeline
        // ------------------------------------------------------------------
        function TimelineView() {
            const s = useStore();
            const [showDone, setShowDone] = useState(false);
            const today = todayStr();
            const dated = s.allTasks
                .filter(t => t.dueDate && t.boardId !== SOMEDAY_MAYBE_BOARD_ID && (showDone || isOpen(t)) && (!s.focusMode || t.isFocusTask))
                .sort((a, b) => a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0);
            const weekEnd = addDays(today, 7);
            const sections = [
                { key: 'earlier', title: s.gentle ? 'Earlier — carried over' : 'Overdue', icon: 'fa-seedling', color: '#C98A2B', tasks: dated.filter(t => t.dueDate < today) },
                { key: 'today', title: 'Today', icon: 'fa-sun', color: 'var(--ripe-mango)', tasks: dated.filter(t => t.dueDate === today) },
                { key: 'tomorrow', title: 'Tomorrow', icon: 'fa-cloud-sun', color: '#6FA3BD', tasks: dated.filter(t => t.dueDate === addDays(today, 1)) },
                { key: 'week', title: 'Next 7 days', icon: 'fa-calendar-week', color: 'var(--sage)', tasks: dated.filter(t => t.dueDate > addDays(today, 1) && t.dueDate <= weekEnd) },
                { key: 'later', title: 'Later', icon: 'fa-calendar', color: 'var(--warm-gray)', tasks: dated.filter(t => t.dueDate > weekEnd) }
            ].filter(sec => sec.tasks.length > 0);

            return (
                <div className="flex-1 flex flex-col overflow-hidden">
                    <ViewHeader title="Timeline" subtitle="Everything with a date, in order. Watch your mangoes ripen 🥭">
                        <label className="flex items-center gap-2 text-sm font-bold cursor-pointer" style={{ color: 'var(--muted)' }}>
                            Show completed <Toggle on={showDone} onChange={setShowDone} label="Show completed tasks" />
                        </label>
                    </ViewHeader>
                    <div className="flex-1 overflow-auto px-4 sm:px-8 pb-24 scrollbar-thin">
                        <div className="max-w-3xl space-y-5">
                            {sections.length === 0 && (
                                <div className="card-gentle">
                                    <EmptyState icon="fa-calendar-alt" title="No dated tasks yet">Give a task a date and it will appear here. Or leave things undated — that’s fine too.</EmptyState>
                                </div>
                            )}
                            {sections.map(sec => (
                                <ListCard key={sec.key} title={sec.title} icon={sec.icon} iconColor={sec.color} count={sec.tasks.length}
                                    action={sec.key === 'earlier' && s.overdueTasks.length > 0 ? <button className="btn btn-sm btn-mango" onClick={s.rolloverAllOverdue}><i className="fas fa-sun"></i>Fresh Start</button> : null}>
                                    {sec.tasks.map(t => <TaskRow key={t.id} task={t} showBoard />)}
                                </ListCard>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Dashboard — encouragement, not surveillance
        // ------------------------------------------------------------------
        function StatTile({ label, value, icon, color, hint }) {
            return (
                <div className="card-gentle shadow-soft p-4 flex items-center gap-3">
                    <span className="w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0" style={{ background: color }}>
                        <i className={`fas ${icon}`} style={{ color: 'var(--soft-black)' }}></i>
                    </span>
                    <div className="min-w-0">
                        <p className="text-2xl font-bold leading-none" style={{ fontFamily: 'Quicksand, sans-serif' }}>{value}</p>
                        <p className="text-xs font-bold mt-1" style={{ color: 'var(--muted)' }}>{label}</p>
                        {hint && <p className="text-[11px]" style={{ color: 'var(--muted)' }}>{hint}</p>}
                    </div>
                </div>
            );
        }

        function DashboardView() {
            const s = useStore();
            const today = todayStr();
            const tasks = s.allTasks;
            const completedOn = (dateStr) => tasks.filter(t => t.status === 'done' && t.completedAt && toDateStr(new Date(t.completedAt)) === dateStr).length;
            const week = Array.from({ length: 7 }, (_, i) => {
                const date = addDays(today, i - 6);
                return { date, count: completedOn(date), label: parseDate(date).toLocaleDateString('en-US', { weekday: 'short' }) };
            });
            const weekTotal = week.reduce((n, d) => n + d.count, 0);
            const maxCount = Math.max(1, ...week.map(d => d.count));
            const open = tasks.filter(isActionable);
            const statuses = [
                { key: 'new', label: 'Not started', color: '#D9CDB4' },
                { key: 'working', label: 'Working', color: 'var(--status-working)' },
                { key: 'stuck', label: 'Stuck', color: '#E88A3C' },
                { key: 'done', label: 'Done', color: 'var(--mango-leaf)' }
            ].map(st => ({ ...st, count: tasks.filter(t => t.status === st.key).length }));
            const total = tasks.length;
            const userBoards = s.boards.filter(b => b.id !== SOMEDAY_MAYBE_BOARD_ID);

            return (
                <div className="flex-1 flex flex-col overflow-hidden">
                    <ViewHeader title="Dashboard" subtitle="See how your mangoes are ripening. Patterns, not pressure. 🥭" />
                    <div className="flex-1 overflow-auto px-4 sm:px-8 pb-24 scrollbar-thin">
                        <div className="max-w-5xl space-y-5">
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                <StatTile label="Done today" value={week[6].count} icon="fa-check" color="rgba(168, 181, 160, 0.6)" />
                                <StatTile label="Done in the last 7 days" value={weekTotal} icon="fa-seedling" color="rgba(248, 197, 109, 0.6)" />
                                <StatTile label="Quick wins waiting" value={open.filter(isQuickWin).length} icon="fa-bolt" color="var(--sunny-yellow)" hint="15 minutes or less" />
                                <StatTile label="Starred for Focus" value={open.filter(t => t.isFocusTask).length} icon="fa-star" color="rgba(244, 162, 89, 0.5)" />
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <div className="card-gentle shadow-soft p-5">
                                    <h3 className="text-lg font-bold">Wins this week</h3>
                                    <p className="text-xs font-semibold mb-4" style={{ color: 'var(--muted)' }}>Tasks completed each day{weekTotal === 0 ? ' — your first win will show up here.' : ''}</p>
                                    <div className="flex items-end gap-2 h-40" role="img" aria-label={`Tasks completed per day over the last 7 days: ${week.map(d => `${d.label} ${d.count}`).join(', ')}`}>
                                        {week.map((d, i) => (
                                            <div key={d.date} className="flex-1 h-full flex flex-col items-center justify-end group" title={`${formatDate(d.date)}: ${d.count} done`}>
                                                <span className="text-xs font-bold mb-1" style={{ color: d.count ? 'var(--charcoal)' : 'transparent' }}>{d.count}</span>
                                                <div className="w-full max-w-[36px] group-hover:opacity-80" style={{
                                                    height: d.count ? `${Math.max(6, (d.count / maxCount) * 78)}%` : 3,
                                                    background: d.count ? 'var(--mango-leaf)' : 'var(--linen)', borderRadius: '4px 4px 0 0', transition: 'height .5s ease'
                                                }}></div>
                                                <span className="text-[11px] font-bold mt-1.5 pt-1.5 w-full text-center border-t" style={{ borderColor: 'var(--linen)', color: i === 6 ? 'var(--charcoal)' : 'var(--muted)' }}>{i === 6 ? 'Today' : d.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="card-gentle shadow-soft p-5">
                                    <h3 className="text-lg font-bold">Where things stand</h3>
                                    <p className="text-xs font-semibold mb-4" style={{ color: 'var(--muted)' }}>{total} task{total === 1 ? '' : 's'} across all boards</p>
                                    <div className="flex w-full h-4 rounded-full overflow-hidden" style={{ background: 'var(--linen)', gap: 2 }} role="img" aria-label={statuses.map(st => `${st.label}: ${st.count}`).join(', ')}>
                                        {statuses.filter(st => st.count > 0).map(st => (
                                            <div key={st.key} title={`${st.label}: ${st.count}`} style={{ width: `${(st.count / total) * 100}%`, background: st.color }}></div>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-2 gap-x-4 gap-y-3 mt-5">
                                        {statuses.map(st => (
                                            <div key={st.key} className="flex items-center gap-2 text-sm">
                                                <span className="w-3 h-3 rounded-sm flex-shrink-0" style={{ background: st.color }}></span>
                                                <span className="font-semibold flex-1">{st.label}</span>
                                                <span className="font-bold">{st.count}</span>
                                            </div>
                                        ))}
                                    </div>
                                    {statuses[2].count > 0 && (
                                        <p className="text-xs mt-4 font-semibold" style={{ color: 'var(--muted)' }}>
                                            <i className="fas fa-hand-holding-heart mr-1.5" style={{ color: 'var(--ripe-mango)' }}></i>
                                            {statuses[2].count} stuck — try breaking one into a tiny first step, or park it in Someday.
                                        </p>
                                    )}
                                </div>
                            </div>

                            <div className="card-gentle shadow-soft p-5">
                                <h3 className="text-lg font-bold mb-4">Boards</h3>
                                <div className="space-y-2">
                                    {userBoards.map(board => {
                                        const all = board.groups.flatMap(g => g.tasks);
                                        const doneCount = all.filter(t => t.status === 'done').length;
                                        const pct = all.length ? Math.round((doneCount / all.length) * 100) : 0;
                                        return (
                                            <button key={board.id} onClick={() => s.navigate('board', board.id)} className="w-full text-left flex items-center gap-3 p-3 rounded-2xl border hover:bg-[#FFFCF6]" style={{ borderColor: 'var(--linen)' }}>
                                                <span className="w-3.5 h-3.5 rounded-full flex-shrink-0" style={{ background: board.color }}></span>
                                                <span className="font-bold flex-1 min-w-0 truncate">{board.name}</span>
                                                <span className="hidden sm:block w-32 h-2 rounded-full flex-shrink-0" style={{ background: 'var(--linen)' }}>
                                                    <span className="block h-2 rounded-full" style={{ width: `${pct}%`, background: 'var(--sanctuary-sage)' }}></span>
                                                </span>
                                                <span className="text-sm font-semibold flex-shrink-0 w-24 text-right" style={{ color: 'var(--muted)' }}>{doneCount} of {all.length} done</span>
                                                <i className="fas fa-chevron-right text-xs" style={{ color: 'var(--warm-gray)' }}></i>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Team
        // ------------------------------------------------------------------
        const AVATAR_OPTIONS = ['👤', '👨🏽‍💼', '👩🏽‍💼', '👨🏽‍💻', '👩🏽‍💻', '👨🏽‍🎨', '👩🏽‍🎨', '👨🏽‍🔧', '👩🏽‍🔧', '👨🏽‍🏫', '👩🏽‍🏫'];

        function MemberForm({ member, onSave, onClose }) {
            const [draft, setDraft] = useState(member || { name: '', email: '', role: '', avatar: '👤' });
            const [error, setError] = useState('');
            const handleImage = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                try {
                    setError('');
                    const avatar = await resizeImage(file, 160);
                    setDraft(d => ({ ...d, avatar }));
                } catch (err) {
                    setError(err.message);
                }
            };
            const submit = (e) => {
                e.preventDefault();
                if (!draft.name.trim()) { setError('Please add a name.'); return; }
                onSave({ ...draft, name: draft.name.trim(), email: (draft.email || '').trim(), role: (draft.role || '').trim() });
            };
            return (
                <Modal onClose={onClose} label={member ? 'Edit team member' : 'Add team member'}>
                    <form onSubmit={submit} className="p-6 space-y-4">
                        <div className="flex items-center justify-between">
                            <h3 className="text-xl font-bold">{member ? 'Edit team member' : 'Add a team member'} 🥭</h3>
                            <button type="button" className="icon-btn" onClick={onClose} aria-label="Close"><i className="fas fa-times"></i></button>
                        </div>
                        <div>
                            <label className="label" htmlFor="member-name">Name</label>
                            <input id="member-name" autoFocus className="field" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="Jordan Lee" />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label className="label" htmlFor="member-role">Role <span className="normal-case font-semibold">(optional)</span></label>
                                <input id="member-role" className="field" value={draft.role || ''} onChange={(e) => setDraft({ ...draft, role: e.target.value })} placeholder="Designer" />
                            </div>
                            <div>
                                <label className="label" htmlFor="member-email">Email <span className="normal-case font-semibold">(optional)</span></label>
                                <input id="member-email" type="email" className="field" value={draft.email || ''} onChange={(e) => setDraft({ ...draft, email: e.target.value })} placeholder="jordan@example.com" />
                            </div>
                        </div>
                        <div>
                            <span className="label">Avatar</span>
                            <div className="flex items-center gap-4 mb-3">
                                <Avatar avatar={draft.avatar} name={draft.name} size={56} />
                                <label className="btn btn-soft btn-sm cursor-pointer">
                                    <i className="fas fa-upload"></i>Upload photo
                                    <input type="file" accept="image/*" onChange={handleImage} className="hidden" />
                                </label>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {AVATAR_OPTIONS.map(a => (
                                    <button type="button" key={a} onClick={() => setDraft({ ...draft, avatar: a })} aria-label={`Use avatar ${a}`} aria-pressed={draft.avatar === a}
                                        className="text-2xl w-11 h-11 rounded-xl border-2" style={{ borderColor: draft.avatar === a ? 'var(--mango-leaf)' : 'var(--linen)' }}>{a}</button>
                                ))}
                            </div>
                        </div>
                        {error && <p className="text-sm font-semibold" style={{ color: '#A93A2F' }}>{error}</p>}
                        <div className="flex justify-end gap-3 pt-2">
                            <button type="button" className="btn btn-soft" onClick={onClose}>Cancel</button>
                            <button type="submit" className="btn btn-primary">{member ? 'Save changes' : 'Add member'}</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function TeamView() {
            const s = useStore();
            const [query, setQuery] = useState('');
            const [editing, setEditing] = useState(null); // null | 'new' | member
            const q = query.trim().toLowerCase();
            const filtered = q ? s.team.filter(m => [m.name, m.email, m.role].some(v => (v || '').toLowerCase().includes(q))) : s.team;
            const openCount = (name) => s.allTasks.filter(t => isActionable(t) && t.assignee === name).length;

            return (
                <div className="flex-1 flex flex-col overflow-hidden">
                    <ViewHeader title="Team" subtitle="People you can assign tasks to. They’re labels for now — nobody gets invited or emailed. 🥭">
                        <div className="flex items-center gap-2">
                            {s.team.length > 3 && (
                                <div className="relative">
                                    <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-sm" style={{ color: 'var(--warm-gray)' }}></i>
                                    <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search people…" aria-label="Search team" className="field" style={{ paddingLeft: '2.2rem', width: '13rem' }} />
                                </div>
                            )}
                            <button className="btn btn-primary" onClick={() => setEditing('new')}><i className="fas fa-user-plus"></i>Add member</button>
                        </div>
                    </ViewHeader>
                    <div className="flex-1 overflow-auto px-4 sm:px-8 pb-24 scrollbar-thin">
                        {s.team.length === 0 ? (
                            <div className="card-gentle max-w-xl">
                                <EmptyState icon="fa-users" title="Flying solo? That’s perfectly fine.">
                                    If you work with others, add them here so you can note who’s handling what.
                                </EmptyState>
                            </div>
                        ) : filtered.length === 0 ? (
                            <p className="text-sm" style={{ color: 'var(--muted)' }}>Nobody matches “{query}”.</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 max-w-5xl">
                                {filtered.map(member => {
                                    const count = openCount(member.name);
                                    return (
                                        <div key={member.id} className="card-gentle shadow-soft p-5 flex items-start gap-4">
                                            <Avatar avatar={member.avatar} name={member.name} size={56} />
                                            <div className="flex-1 min-w-0">
                                                <h3 className="font-bold text-lg truncate">{member.name}</h3>
                                                {member.role && <p className="text-sm font-semibold truncate" style={{ color: '#3F5F3F' }}>{member.role}</p>}
                                                {member.email && <p className="text-xs truncate mt-0.5" style={{ color: 'var(--muted)' }}>{member.email}</p>}
                                                <span className="chip mt-2">{count} open task{count === 1 ? '' : 's'}</span>
                                            </div>
                                            <div className="flex flex-col">
                                                <button className="icon-btn" onClick={() => setEditing(member)} aria-label={`Edit ${member.name}`}><i className="fas fa-pen text-xs"></i></button>
                                                <button className="icon-btn" aria-label={`Remove ${member.name}`} onClick={() => {
                                                    s.deleteTeamMember(member.id);
                                                    s.showToast({ message: `${member.name} removed`, icon: 'fa-user-minus', action: { label: 'Undo', onClick: () => s.addTeamMember(member) } });
                                                }}><i className="fas fa-trash text-xs"></i></button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    {editing && (
                        <MemberForm member={editing === 'new' ? null : editing} onClose={() => setEditing(null)}
                            onSave={(data) => {
                                if (editing === 'new') s.addTeamMember(data);
                                else s.updateTeamMember(editing.id, data);
                                setEditing(null);
                            }} />
                    )}
                </div>
            );
        }

        // ------------------------------------------------------------------
        // Boot
        // ------------------------------------------------------------------
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { error: null };
            }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) { console.error('EveryMango error:', error, info); }
            render() {
                if (!this.state.error) return this.props.children;
                return (
                    <div className="app-height flex items-center justify-center p-6" style={{ background: 'var(--cream)' }}>
                        <div className="card-gentle shadow-soft-lg p-8 max-w-md text-center">
                            <h1 className="text-2xl font-bold mb-2">Something went sideways</h1>
                            <p className="text-sm mb-6" style={{ color: 'var(--muted)' }}>Your saved tasks are safe. Reloading usually sorts this out.</p>
                            <button className="btn btn-primary" onClick={() => window.location.reload()}><i className="fas fa-redo"></i>Reload EveryMango</button>
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
